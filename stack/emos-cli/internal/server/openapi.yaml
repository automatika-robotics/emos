openapi: 3.1.0
info:
  title: EMOS Onboarding API
  version: "1.0.0"
  summary: Local-network REST API for the EMOS dashboard and agentic clients.
  description: |
    Every endpoint speaks JSON unless explicitly noted. SSE endpoints emit
    `text/event-stream`. All write operations require a bearer token issued
    via `POST /auth/pair`.

    Errors share a single shape: `{"code": "...", "message": "...", "details": {}}`.
    The `code` field is stable; `message` may change.
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
                  uptime: { type: string }
  /info:
    get:
      summary: Install + runtime info (mode, distro, version, paths)
      security: []
      responses:
        "200":
          description: ok
  /capabilities:
    get:
      summary: Feature flags the UI uses for conditional rendering
      security: []
      responses:
        "200":
          description: ok
  /connectivity:
    get:
      summary: Cached internet reachability (offline indicator source)
      security: []
      parameters:
        - in: query
          name: refresh
          schema: { type: string, enum: ["1"] }
          description: Force a fresh probe instead of returning cached value.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: { type: boolean }
                  last_checked_at: { type: string, format: date-time }
                  target: { type: string }
  /openapi.yaml:
    get:
      summary: Self-served OpenAPI document
      security: []
      responses:
        "200":
          description: yaml
  /auth/pair:
    post:
      summary: Exchange a pairing code for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Six-digit code printed on first `emos serve` boot.
                label: { type: string }
      responses:
        "200":
          description: ok
        "401":
          description: invalid code
  /auth/me:
    get:
      summary: Verify the bearer token
      security: []
      responses:
        "200":
          description: authenticated
        "401":
          description: invalid or missing token
  /robot:
    get:
      summary: Best-effort robot identity. 404 if unknown.
      responses:
        "200":
          description: identity
        "404":
          description: not_found
  /license:
    get:
      summary: The license kept on this machine, without its key. Always offline-OK.
      description: |
        Read from the machine, never from the support portal. `licensed` is false
        for an install without a license, which then carries `sales_email`.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
  /recipes/local:
    get:
      summary: Recipes installed under ~/emos/recipes/. Always offline-OK.
      responses:
        "200":
          description: ok
  /recipes/remote:
    get:
      summary: Catalog of recipes from the Automatika API. Requires internet.
      responses:
        "200":
          description: ok
        "503":
          description: offline or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /recipes/{name}:
    get:
      summary: Recipe detail with extracted topics
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
        "404": { description: not installed }
    delete:
      summary: Remove a recipe directory
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "204": { description: removed }
  /recipes/{name}/pull:
    post:
      summary: Start a recipe download. Returns a job_id; stream via /jobs/{id}/logs.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        "503":
          description: offline
  /plugins/remote:
    get:
      summary: Catalog of robot and sensor plugins from the Automatika API. Requires internet.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string }
                    name: { type: string }
                    vendor: { type: string }
                    role: { type: string, enum: [robot, sensor] }
                    description: { type: string }
                    tags: { type: array, items: { type: string } }
                    entry_point: { type: string }
        "503":
          description: offline or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /plugins/installed:
    get:
      summary: Installed plugins — the robot (or null) and the sensor plugins alongside it. Nothing installed is an ordinary 200, not a 404.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [robot, sensors]
                properties:
                  robot:
                    oneOf:
                      - $ref: "#/components/schemas/InstalledPlugin"
                      - type: "null"
                  sensors:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstalledPlugin"
  /plugins/{slug}/install:
    post:
      summary: Start a plugin install job (clone, resolve dependencies, build). Returns a job_id; stream via /jobs/{id}/logs.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        "400": { description: EMOS not installed or missing slug }
        "409": { description: another plugin install, update or removal is in progress, or a recipe is running }
        "503": { description: offline }
  /plugins/{slug}:
    delete:
      summary: Remove one installed plugin as a background job; the overlay is rebuilt from what remains.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        "404": { description: not installed }
        "409": { description: another plugin install, update or removal is in progress, or a recipe is running }
  /runs:
    get:
      summary: Currently running + recent finished runs
      responses:
        "200": { description: ok }
    post:
      summary: Start a recipe run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe: { type: string }
                rmw:
                  type: string
                  enum: [rmw_zenoh_cpp, rmw_fastrtps_cpp, rmw_cyclonedds_cpp]
                  description: Omit to leave RMW_IMPLEMENTATION as the daemon's environment has it, or ROS's default.
      responses:
        "202": { description: accepted }
        "409": { description: another recipe already running, or plugins are being installed, updated or removed }
  /runs/{id}:
    get:
      summary: Status of a single run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
        "404": { description: not found }
    delete:
      summary: Cancel a running recipe (SIGTERM, then SIGKILL after grace)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: cancellation requested }
  /runs/{id}/logs:
    get:
      summary: SSE stream of recipe stdout/stderr (history then live tail)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream: {}
  /jobs:
    get:
      summary: Active and recent background jobs
      responses:
        "200": { description: ok }
  /jobs/{id}:
    get:
      summary: Job snapshot
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
        "404": { description: not found }
  /jobs/{id}/logs:
    get:
      summary: SSE stream of job progress events
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    InstalledPlugin:
      type: object
      required: [slug, entry_point, role, repo, installed_at]
      properties:
        slug: { type: string }
        entry_point: { type: string, description: "module:ClassName" }
        role: { type: string, enum: [robot, sensor] }
        repo: { type: string }
        ref: { type: string }
        image_url: { type: string }
        sources:
          type: array
          items: { type: string }
          description: Driver packages cloned and built from source alongside the plugin.
        describe:
          type: object
          additionalProperties: true
          description: The plugin's cached describe() tree (metadata, feedbacks, commands, actions, events, role).
        installed_at: { type: string, format: date-time }
    License:
      type: object
      required: [licensed]
      properties:
        licensed: { type: boolean }
        holder: { type: string, description: Who the license was issued to. }
        robot: { type: string, description: The robot the license is for. }
        plugin_slug: { type: string, description: That robot's plugin in the catalog. }
        tier: { type: string, enum: [expert, pro, enterprise] }
        serial_number: { type: string }
        activated_at: { type: string, format: date-time, description: When it was activated on the support portal. }
        verified_at: { type: string, format: date-time, description: When this machine last verified it. }
        support_url: { type: string, description: Where a license holder gets help. }
        sales_email: { type: string, description: Where a license is asked for. Only without one. }
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code (e.g. offline, not_found, already_running).
        message: { type: string }
        details: { type: object, additionalProperties: true }
