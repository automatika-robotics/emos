name: Pixi Install Test

on:
  push:
    branches: [main]
    paths:
      - "pixi.toml"
      - "stack/emos-cli"
      - "stack/emos-cli/**"
      - "stack/sugarcoat"
      - "stack/sugarcoat/**"
      - "stack/embodied-agents"
      - "stack/embodied-agents/**"
      - "stack/kompass"
      - "stack/kompass/**"
      - "stack/emos_mapping/**"
  pull_request:
    paths:
      - "pixi.toml"
      - "stack/emos-cli"
      - "stack/emos-cli/**"
      - "stack/sugarcoat"
      - "stack/sugarcoat/**"
      - "stack/embodied-agents"
      - "stack/embodied-agents/**"
      - "stack/kompass"
      - "stack/kompass/**"
      - "stack/emos_mapping/**"
  schedule:
    - cron: "0 4 * * *" # Daily at 4 AM UTC, after the Docker nightly
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

jobs:
  pixi-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}
    name: Pixi Install / ${{ matrix.os }}

    # scikit-build-core: ignore pixi's unknown config settings (for pixi > 0.66).
    env:
      SKBUILD_STRICT_CONFIG: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install dependencies
        run: pixi install

      - name: Install kompass-core
        run: pixi run install-kompass-core

      - name: Build EMOS packages
        run: pixi run build

      - name: Verify Python imports
        run: |
          pixi run bash -c "source install/setup.sh && python3 -c '
          import ros_sugar; import agents; import kompass; import kompass_core; import kompass_cpp
          import emos_mapping
          print(\"kompass-core accelerators:\", kompass_cpp.get_available_accelerators().split())
          print(\"All EMOS imports: OK\")
          '"

      - name: Verify ROS packages
        run: |
          pixi run bash -c "source install/setup.sh && ros2 pkg list" | grep -E "automatika_ros_sugar|automatika_embodied_agents|kompass|emos_mapping"

      - name: Verify ROS 2 tools
        run: pixi run ros2 --help

      # NOTE: Remove launch testing (ROS pytest9 and launch_testing plugin pytest7 mismatch)
      - name: Test emos_mapping
        working-directory: stack/emos_mapping
        run: pixi run --manifest-path ../../pixi.toml bash -c "source ../../install/setup.sh && python3 -m pytest test -q -p no:launch_testing -p no:launch_ros"
