[workspace]
name = "emos"
description = "The Embodied Operating System — unified orchestration layer for Physical AI"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

# Let scikit-build-core ignore pixi's unknown config-settings (for pixi > 0.66).
[activation.env]
SKBUILD_STRICT_CONFIG = "false"

# Preloads OpenMP on Ubuntu 20.04 aarch64.
[target.linux-aarch64.activation]
scripts = ["stack/emos-cli/scripts/pixi_activate_aarch64.sh"]

# Pyaudio gets built from src on aarch64
[target.linux-aarch64.activation.env]
CFLAGS = "-idirafter /usr/include" # Make GCC drop -I/usr/include of the pyaudio source build, keeping the environment's glibc headers first

# --- Conda Dependencies ---
[dependencies]
# Python
python = ">=3.11"

# Build tools
cmake = "*"
compilers = "*"
make = "*"
colcon-common-extensions = "*"
pip = "*"

# ROS 2 Jazzy — base
ros-jazzy-ros-base = "*"

# ROS 2 Jazzy — middleware
ros-jazzy-rmw-zenoh-cpp = "*"

# ROS 2 Jazzy — build system
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"

# ROS 2 Jazzy — core libraries needed by EMOS packages
ros-jazzy-rclpy = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-lifecycle-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-builtin-interfaces = "*"
ros-jazzy-action-msgs = "*"
ros-jazzy-rpyutils = "*"

# ROS 2 Jazzy — localization (pre-built, replaces colcon Stage 1)
ros-jazzy-robot-localization = "*"
ros-jazzy-geographic-msgs = "*"
ros-jazzy-angles = "*"

# ROS 2 Jazzy — kinematics (for kompass)
ros-jazzy-python-orocos-kdl-vendor = "*"

# System libraries
portaudio = "*"
jq = "*"
geographiclib = "*"

# kompass-core build dependencies
ompl = "*"
fcl = "*"
eigen = ">=3.4,<4"

# Python packages (conda-forge). Cross-platform.
numpy = "*"
opencv = "*"
attrs = ">=23.2.0"
jinja2 = "*"
httpx = "*"
setproctitle = "*"
msgpack-python = "*"
msgpack-numpy = "*"
platformdirs = "*"
tqdm = "*"
pyyaml = "*"
toml = "*"
websockets = "*"
redis-py = "*"
python-fasthtml = ">=0.12,<0.15"
grpcio = "*"
protobuf = "*"
huggingface_hub = "*"

# --- PyPI Dependencies (not on conda-forge) ---
[pypi-dependencies]
monsterui = ">=1.0,<1.1"
sherpa-onnx = "*"
ollama = "*"
soundfile = "*"
# Install llama-cpp-python from its own index (pypi only has src for aarch64)
llama-cpp-python = { version = "*", index = "https://abetlen.github.io/llama-cpp-python/whl/cpu" }
onnxruntime = "*"

# --- PyAudio (conda-forge has it for x86 only) ---
# conda package on x86
[target.linux-64.dependencies]
pyaudio = "*"

# built from src on aarch64, with the CFLAGS set above
[target.linux-aarch64.pypi-dependencies]
PyAudio = "*"

# --- Tasks ---
[tasks]
# Install kompass-core with GPU support (SYCL via AdaptiveCpp).
# Uses apt for LLVM/Clang only; OMPL and FCL come from pixi (conda-forge).
install-kompass-core = "bash stack/emos-cli/scripts/install_kompass_core_pixi.sh"

# Build the native mapping backend (GTSAM, gtsam_points, GLIM, glim_ros2) from source.
# On demand, through 'emos map setup'.
install-mapping-backend = "bash stack/emos-cli/scripts/install_mapping_backend_pixi.sh"

# Build sherpa-onnx and llama-cpp-python with CUDA, from source.
# Offered when CUDA is found during setup.
install-cuda-packages = "bash stack/emos-cli/scripts/install_cuda_packages_pixi.sh"

# Build EMOS ROS packages (sugarcoat, kompass, embodied-agents, kompass_interfaces, emos_mapping)
build = """colcon build \
  --merge-install \
  --symlink-install \
  --base-paths stack/sugarcoat stack/kompass stack/embodied-agents stack/emos_mapping \
  --cmake-args -DCMAKE_BUILD_TYPE=Release"""

# Register pixi installation with EMOS CLI config.
register = """python3 -c "
import json, os, pathlib
config_dir = pathlib.Path.home() / '.config' / 'emos'
config_dir.mkdir(parents=True, exist_ok=True)
cfg_path = config_dir / 'config.json'
config = {}
if cfg_path.exists():
    try:
        config = json.loads(cfg_path.read_text())
    except Exception:
        config = {}
config['mode'] = 'pixi'
config['ros_distro'] = 'jazzy'
config['pixi_project_dir'] = os.environ.get('PIXI_PROJECT_ROOT', os.getcwd())
cfg_path.write_text(json.dumps(config, indent=2))
print('EMOS config written to', cfg_path)
" """

# Full setup: install kompass-core, build packages, register with CLI
setup = { depends-on = ["install-kompass-core", "build", "register"] }
